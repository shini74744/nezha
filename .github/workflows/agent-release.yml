name: Test and build owned Agent release
on:
  push:
    tags: ['agent-v*']
    branches: [main, 'consolidate-*', 'test/ddnezha-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Bare owned semantic version
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: owned-agent-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: agent
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: false
      - name: Tests and vet
        shell: bash
        run: |
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
      - name: Native Windows installer rollback and channel tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install_windows.ps1
      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Execute generated Windows installation command in an isolated fixture
        if: runner.os == 'Windows'
        working-directory: frontend/admin
        shell: bash
        run: |
          npm ci
          npm test -- --run src/test/install-commands.test.ts
      - name: Build two native lifecycle versions
        shell: bash
        run: |
          set -euo pipefail
          ext=""; [[ "$RUNNER_OS" != Windows ]] || ext=".exe"
          arch="$(go env GOARCH)"
          for version in 1.0.1 1.0.2; do
            mkdir -p "$RUNNER_TEMP/ddnezha-$version"
            go build -mod=readonly -trimpath -ldflags "-X github.com/nezhahq/agent/pkg/monitor.Version=$version -X main.arch=$arch" -o "$RUNNER_TEMP/ddnezha-$version/DDnezha$ext" ./cmd/agent
          done
      - name: Native POSIX official coexistence lifecycle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" PATH="$PATH" "$(command -v python3)" scripts/test_native_coexistence.py --binary "$RUNNER_TEMP/ddnezha-1.0.2/DDnezha" --old-binary "$RUNNER_TEMP/ddnezha-1.0.1/DDnezha"
      - name: Native Windows official coexistence lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_native_coexistence.ps1 -Binary "$env:RUNNER_TEMP/ddnezha-1.0.2/DDnezha.exe" -OldBinary "$env:RUNNER_TEMP/ddnezha-1.0.1/DDnezha.exe"
      - name: Race tests and installer safety
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox
          go test -mod=readonly -race ./...
          # Installer fixtures exercise root-owned 0700 backups; run their harness
          # with the same identity so cleanup never depends on runner permissions.
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v scripts.test_install_uninstall scripts.test_install_elevation scripts.test_install_output scripts.test_install_progress scripts.test_install_isolation release.test_installers
  build:
    if: startsWith(github.ref, 'refs/tags/agent-v') || startsWith(github.ref, 'refs/heads/test/ddnezha-') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-latest
            artifact: agent-linux-amd64
          - target: linux/arm64
            runner: ubuntu-latest
            artifact: agent-linux-arm64
          - target: linux/386
            runner: ubuntu-latest
            artifact: agent-linux-386
          - target: linux/arm
            runner: ubuntu-latest
            artifact: agent-linux-arm
          - target: linux/mips
            runner: ubuntu-latest
            artifact: agent-linux-mips
          - target: linux/mipsle
            runner: ubuntu-latest
            artifact: agent-linux-mipsle
          - target: linux/riscv64
            runner: ubuntu-latest
            artifact: agent-linux-riscv64
          - target: linux/s390x
            runner: ubuntu-latest
            artifact: agent-linux-s390x
          - target: linux/loong64
            runner: ubuntu-latest
            artifact: agent-linux-loong64
          - target: darwin/amd64
            runner: ubuntu-latest
            artifact: agent-darwin-amd64
          - target: darwin/arm64
            runner: macos-latest
            artifact: agent-darwin-arm64
          - target: windows/amd64
            runner: windows-latest
            artifact: agent-windows-amd64
          - target: windows/386
            runner: ubuntu-latest
            artifact: agent-windows-386
          - target: windows/arm64
            runner: ubuntu-latest
            artifact: agent-windows-arm64
          - target: freebsd/amd64
            runner: ubuntu-latest
            artifact: agent-freebsd-amd64
          - target: freebsd/386
            runner: ubuntu-latest
            artifact: agent-freebsd-386
          - target: freebsd/arm
            runner: ubuntu-latest
            artifact: agent-freebsd-arm
          - target: freebsd/arm64
            runner: ubuntu-latest
            artifact: agent-freebsd-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: false
      - name: Build checked release package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          AGENT_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then
            VERSION="${RELEASE_TAG#agent-v}"
          else
            VERSION="$(sed 's/^v//' ../release/agent-version.txt)"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bash release/build.sh "$VERSION" "$PWD/dist"
          case "$AGENT_BUILD_TARGET" in
            linux/amd64) actual="$(dist/linux_amd64/DDnezha -v)"; [[ "$actual" == *" $VERSION" ]] ;;
            darwin/arm64) actual="$(dist/darwin_arm64/DDnezha -v)"; [[ "$actual" == *" $VERSION" ]] ;;
            windows/amd64) actual="$(dist/windows_amd64/DDnezha.exe -v)"; [[ "$actual" == *" $VERSION" ]] ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            agent/dist/*.zip
            agent/dist/*.sha256
            agent/dist/agent-release.json
          if-no-files-found: error
          retention-days: 7
