name: Verify v0.0.28 on macOS
on:
  push:
    branches: ['release-ci/macos-v028-20261118']
permissions:
  contents: read
jobs:
  macos-release-source:
    name: macOS release source tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 62885f60211071d6a5ffd237b1433f8e6548157a
          persist-credentials: false
      - name: Verify exact release source
        run: test "$(git rev-parse HEAD)" = 62885f60211071d6a5ffd237b1433f8e6548157a
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: false
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          touch ./cmd/dashboard/user-dist/a
          touch ./cmd/dashboard/admin-dist/a
          swag init --pd -d cmd/dashboard -g main.go -o cmd/dashboard/docs
      - name: Unit test
        run: go test -mod=readonly -count=1 ./...
      - name: Build dashboard
        run: go build -v ./cmd/dashboard
