name: Verify v0.0.29 on macOS
on:
  push:
    branches: ['release-ci/macos-v029-20261120']
permissions:
  contents: read
jobs:
  macos-release-source:
    name: macOS release source tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v0.0.29~2
          persist-credentials: false
      - name: Verify exact release source
        run: test "$(git rev-parse HEAD)" = v0.0.29~2
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: false
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          touch ./cmd/dashboard/user-dist/a
          touch ./cmd/dashboard/admin-dist/a
          swag init --pd -d cmd/dashboard -g main.go -o cmd/dashboard/docs
      - name: Unit test
        run: go test -mod=readonly -count=1 ./...
      - name: Build dashboard
        run: go build -v ./cmd/dashboard
