<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="shortcut icon" type="image/svg+xml" href="/logo.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>哪吒监控 Nezha Monitoring</title>
        <script>
            // Keep the initial paint in sync with the dashboard-only preference.
            ;(() => {
                let theme = "system"
                try {
                    const saved = localStorage.getItem("nezha-dashboard-theme")
                    if (["light", "dark", "system"].includes(saved)) theme = saved
                } catch {}
                document.documentElement.classList.add(
                    theme === "system"
                        ? matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
                        : theme,
                )
            })()
        </script>
    </head>

    <body>
        <div id="root" translate="no" class="notranslate"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
